<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Crossword Generator</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Mini Crossword Generator</h1>
        <p>Generate a small crossword and see the grid + clues.</p>
      </header>

      <section class="controls">
        <label for="size">Grid size (3-9):</label>
        <input id="size" type="number" min="3" max="9" value="5" />
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="easy" selected>Easy</option>
          <option value="standard">Standard</option>
          <option value="hard">Hard</option>
        </select>
        <button id="theme-toggle" type="button">Dark mode</button>
        <button id="generate">Generate</button>
        <button id="check">Check</button>
        <button id="clear">Clear</button>
        <button id="reveal">Reveal</button>
        <span id="status" class="status"></span>
      </section>

      <section class="content">
        <div class="grid-wrap">
          <h2>Grid</h2>
          <div id="grid" class="grid"></div>
          <div class="dance-wrap" aria-hidden="true">
            <div class="dancer">
              <div class="head"></div>
              <div class="torso"></div>
              <div class="arm arm-left"></div>
              <div class="arm arm-right"></div>
              <div class="leg leg-left"></div>
              <div class="leg leg-right"></div>
            </div>
          </div>
        </div>

        <div class="clues">
          <h2>Across</h2>
          <ol id="across"></ol>
          <h2>Down</h2>
          <ol id="down"></ol>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
